<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Danh mục sản phẩm</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app" class="wrap">
  <h1>Danh mục sản phẩm</h1>
  <p class="notice" v-if="thongBao" role="status">{{ thongBao }}</p>

  <div class="luoi">
    <!-- Một component dùng lại cho mọi sản phẩm; dữ liệu truyền xuống bằng v-bind (:) -->
    <the-san-pham
      v-for="sp in danhSach"
      :key="sp.id"
      :ten="sp.ten"
      :gia="sp.gia"
      :anh="sp.anh"
      :mo-ta="sp.moTa"
      :ton-kho="sp.tonKho"
      @mua="xuLyMua">
    </the-san-pham>
  </div>
</div>

<!-- Nạp component trước, sau đó mới tới app.js (nơi đăng ký và mount) -->
<script src="components/TheSanPham.js"></script>
<script src="js/app.js"></script>
</body>
</html>
